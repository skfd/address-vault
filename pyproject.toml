[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "addressvault"
version = "0.1.0"
description = "Central tiered store for raw city address dumps (hot disk + restic cold archive)."
requires-python = ">=3.11"
dependencies = ["requests", "ijson"]

[project.optional-dependencies]
shapefile = ["pyshp", "pyproj"]
dev = ["pytest"]

[project.scripts]
addressvault = "addressvault.cli:main"

[tool.setuptools.packages.find]
include = ["addressvault*"]
